; ST7789 Display Test with TFT_eSPI (ESP32-C3 Super Mini)
; Pin mapping from: thesolaruniverse.wordpress.com (June 2024)
; Display: 240×240 square panel, CS tied to GND on module
; Run: cd st7789_tftespi_test && pio run --target upload

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = direct

upload_protocol = esptool
upload_port = /dev/cu.usbmodem3101
monitor_port = /dev/cu.usbmodem3101

board_build.flash_mode = dio
board_build.f_flash = 40000000L

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    ; ── TFT_eSPI setup ───────────────────────────────────────
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240

    ; ── ESP32-C3 Super Mini → ST7789 (thesolaruniverse) ──────
    ;   SCL→GPIO2, SDA→GPIO4, RES→GPIO0, DC→GPIO1, CS→GND
    -D TFT_MOSI=4
    -D TFT_SCLK=2
    -D TFT_CS=10
    -D TFT_DC=1
    -D TFT_RST=0
    -D TFT_BL=-1
    -D TFT_BACKLIGHT_ON=HIGH

    ; No MISO pin
    -D TFT_MISO=-1

    ; ── SPI speed ────────────────────────────────────────────
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    ; ── Colour order ─────────────────────────────────────────
    -D TFT_RGB_ORDER=TFT_BGR

    ; ── Fonts ────────────────────────────────────────────────
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

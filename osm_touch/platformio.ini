; OSM tile viewer with capacitive-touch panning — 2.8" IPS ESP32-S3 + ILI9341 (ES3C28P/ES3N28P)
; Fetches OSM tiles over WiFi, shows on ILI9341, pans via FT6336 touch.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_protocol = esptool
upload_port = COM9
monitor_port = COM9

; 16MB QIO flash + 8MB Octal PSRAM (qio_opi) — the tile cache lives in PSRAM
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; The OpenStreetMap-esp32 library is vendored locally in lib/ (PIO's registry
; install only exposes a single header, so we vendor the full source instead).
; Its dependencies are pinned here:
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.7
    https://github.com/bitbank2/PNGdec.git#1.1.3

; The library (and LovyanGFX) need C++17
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

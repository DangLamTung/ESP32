; PlatformIO Project Configuration for ESP32-C3 (Super Mini or DevKitM-1)
; Both boards use the same ESP32-C3 chip → same board definition works
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32@5.3.0
board = esp32-c3-devkitm-1
framework = espidf

; Serial monitor settings
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

; Upload settings - using USB-Serial/JTAG
upload_protocol = esptool
upload_port = /dev/cu.usbmodem3101
monitor_port = /dev/cu.usbmodem3101

; Board-specific settings for ESP32-C3 with 4MB flash
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv

build_flags =
    -Wno-unused-function
    -Wno-unused-variable
    -Wno-shift-count-negative
